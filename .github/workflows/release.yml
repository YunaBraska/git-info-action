# yuna-release: true
name: 🏷️ CD · Release

on:
  workflow_dispatch:
    inputs:
      semver_strategy:
        description: Version.
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      force:
        description: Force.
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  release:
    permissions:
      contents: read
    uses: YunaBraska/YunaBraska/.github/workflows/wc_node_release.yml@496af352a3cfe100eae3e5f7b7e0e47299ff6fe0
    with:
      force: ${{ inputs.force }}
      semver_strategy: ${{ inputs.semver_strategy }}

  github:
    needs:
      - release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.release == 'true' }}
    permissions:
      contents: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_node_create_github_release.yml@496af352a3cfe100eae3e5f7b7e0e47299ff6fe0
    with:
      commit_sha: ${{ needs.release.outputs.commit_sha }}
      version: ${{ needs.release.outputs.version }}
