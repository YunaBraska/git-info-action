name: 🔄 CI · Main

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Ref.
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: build-main-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: YunaBraska/YunaBraska/.github/workflows/wc_node_build_common.yml@0efa5d3b275e474e54af0ced8ba1a771f6b9df7c
    with:
      ref: ${{ inputs.ref || github.sha }}
