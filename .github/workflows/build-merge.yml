name: 🔄 CI · Main

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Ref.
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: build-main-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: YunaBraska/YunaBraska/.github/workflows/wc_node_build_common.yml@807b79318cc6e4242e6fc6b4be358b58218d96ab
    with:
      ref: ${{ github.event.inputs.ref || github.sha }}
