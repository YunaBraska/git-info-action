name: 🔄 CI · Main

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Ref.
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: build-main-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: YunaBraska/YunaBraska/.github/workflows/wc_node_build_common.yml@f122a3096e6ac9b674320772242bc6d47cf396c7
    with:
      ref: ${{ github.event.inputs.ref || github.sha }}
